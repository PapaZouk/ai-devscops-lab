name: Reusable AI Security Fixer

on:
  workflow_call:
    inputs:
      vulnerability_description:
        required: true
        type: string
      llm_url:
        required: true
        type: string
      llm_model_name:
        required: true
        type: string
      run_environment:
        required: false
        type: string
        default: "prod"
      skip_delivery:
        required: false
        type: boolean
        default: false
    secrets:
      LM_API_KEY:
        required: true

permissions:
  contents: write 
  pull-requests: write

jobs:
  api-patch:
    runs-on: ubuntu-latest
    
    env:
      TARGET_DIR: "${{ github.workspace }}/target-repo"
      TOOLS_DIR: "${{ github.workspace }}/ai-tools"
      SKILLS_PATH: "${{ github.workspace }}/target-repo/skills" 

    steps:
      - name: Checkout Repositories
        run: |
          echo "📥 Fetching Target and AI Tools..."
        
      - uses: actions/checkout@v4
        with:
          path: target-repo 

      - uses: actions/checkout@v4
        with:
          repository: PapaZouk/ai-devscops-lab
          path: ai-tools

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install & Build AI Stack
        run: |
          # Build MCP Server
          cd $TOOLS_DIR/mcp-security-server
          npm install && npm run build
          
          # Install Doctor App
          cd $TOOLS_DIR/ai-app-doctor
          npm install

          # Ensure DB is initialized in the Tools directory
          export PROJECT_ROOT="$TOOLS_DIR/ai-app-doctor"
          npx tsx src/utils/initDb.ts
          
          echo "✅ AI Tools setup complete."
          echo "🔍 Target repo ready at $TARGET_DIR"
          echo "🚀 Starting AI Security Fixer..."
        shell: bash

      - name: Path Treatment (Symlink Skills)
        run: |
          echo "🔗 Linking skills to target-repo..."
          rm -rf $TARGET_DIR/skills
          ln -s $TOOLS_DIR/ai-app-doctor/skills $TARGET_DIR/skills
          find $TOOLS_DIR/ai-app-doctor/skills -name "*.sh" -exec chmod +x {} +
          echo "✅ Execution permissions set for skill scripts."

      - name: Run AI Fixer
        working-directory: ai-tools/ai-app-doctor
        run: |
          npx tsx src/main.ts \
            --agent=security \
            --target=$TARGET_DIR \
            --input="${{ inputs.vulnerability_description }}"
        env:
          LM_API_KEY: ${{ secrets.LM_API_KEY }}
          LM_BASE_URL: ${{ inputs.llm_url }}
          LM_MODEL_NAME: ${{ inputs.llm_model_name }}
          SKIP_DELIVERY: ${{ (inputs.run_environment == 'dev' || inputs.skip_delivery) && 'true' || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Points to tools directory so memory tools find the correct agent_state.db
          PROJECT_ROOT: ${{ github.workspace }}/ai-tools/ai-app-doctor

      - name: Save Output
        run: |
          echo "📁 Saving AI Fixer output for review..."
          mkdir -p $GITHUB_WORKSPACE/ai-fixer-output
          cp -r $TARGET_DIR/* $GITHUB_WORKSPACE/ai-fixer-output/
          echo "✅ Output saved to $GITHUB_WORKSPACE/ai-fixer-output/"
        shell: bash
