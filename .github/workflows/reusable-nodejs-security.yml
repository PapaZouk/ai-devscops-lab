name: Reusable AI Security Fixer

on:
  workflow_call:
    inputs:
      vulnerability_description:
        required: true
        type: string
      llm_url:
        required: true
        type: string
      llm_model_name:
        required: true
        type: string
    secrets:
      LM_API_KEY:
        required: true

permissions:
  contents: write 
  pull-requests: write

jobs:
  api-patch:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ai-tools/ai-app-doctor

    steps:
      - name: Checkout Target (Vulnerable) Repo
        uses: actions/checkout@v4
        with:
          path: target-repo 

      - name: Checkout AI Tools Repo
        uses: actions/checkout@v4
        with:
          repository: PapaZouk/ai-devscops-lab
          path: ai-tools

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install Dependencies
        run: npm install

      - name: Build MCP Server
        run: |
          cd ../mcp-security-server
          npm install
          npm run build

      - name: Copy Skills to Target
        run: |
          # Remove existing link if it exists
          rm -rf ${{ github.workspace }}/target-repo/skills
          # Copy the actual directory so there's no symlink confusion
          cp -r ${{ github.workspace }}/ai-tools/ai-app-doctor/skills ${{ github.workspace }}/target-repo/skills
          # Grant permissions
          chmod -R +x ${{ github.workspace }}/target-repo/skills

      - name: Prep Skills
        run: |
          echo "🧼 Sterilizing instruments: granting +x to all skill scripts..."
          find ${{ github.workspace }}/ai-tools/ai-app-doctor/skills -name "*.sh" -exec chmod +x {} +
        shell: bash

      - name: Path Pre-flight Check
        run: |
          echo "::group::Environment Path Validation"
          # Define paths relative to the actual workspace
          export PROJECT_ROOT="${{ github.workspace }}"
          export SKILLS_PATH="${{ github.workspace }}/ai-tools/ai-app-doctor/skills"
          
          chmod +x "$SKILLS_PATH/debug-tools/debug-paths.sh"
          "$SKILLS_PATH/debug-tools/debug-paths.sh"
          echo "::endgroup::"
        env:
          PROJECT_ROOT: "${{ github.workspace }}"
          SKILLS_PATH: "${{ github.workspace }}/ai-tools/ai-app-doctor/skills"

      - name: Run AI Fixer
        run: |
          TARGET_PATH="${{ github.workspace }}/target-repo"
          
          npx tsx src/main.ts \
            --agent=security \
            --target=$TARGET_PATH \
            --input="${{ inputs.vulnerability_description }}"
        env:
          # Modular anchors for the MCP Server
          PROJECT_ROOT: "${{ github.workspace }}"
          SKILLS_PATH: "${{ github.workspace }}/ai-tools/ai-app-doctor/skills"
          CWD: "${{ github.workspace }}/target-repo"
          
          # LLM Config
          LM_API_KEY: ${{ secrets.LM_API_KEY }}
          LM_BASE_URL: ${{ inputs.llm_url }}
          LM_MODEL_NAME: ${{ inputs.llm_model_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}