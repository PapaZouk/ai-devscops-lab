name: "Snyk AI Remediation"

on:
  workflow_call:
    inputs:
      target_repository:
        description: 'The full name of the repo to fix'
        required: true
        type: string
      target_subdirectory:
        description: 'Optional subdirectory inside the target repository to scan/fix'
        required: false
        type: string
      llm_url:
        description: 'The URL of the LLM service'
        required: true
        type: string
      llm_model_name:
        description: 'The name of the LLM model to use'
        required: true
        type: string
      run_environment:
        description: 'The environment to run the fixes in (e.g., prod, staging)'
        required: false
        type: string
      skip_delivery:
        description: 'Whether to skip the delivery of fixes'
        required: false
        type: boolean
        default: false
    secrets:
      SNYK_TOKEN:
        description: 'Snyk API Token'
        required: true
      LM_API_KEY:
        required: true
      GH_TOKEN:
        required: true

jobs:
  snyk-scan-and-fix:
    runs-on: ubuntu-latest
    env:
      TARGET_REPO_DIR: ${{ github.workspace }}/target-repo
      TARGET_DIR: ${{ github.workspace }}/target-repo
      TOOLS_DIR: ${{ github.workspace }}/ai-tools
      REPORT_PATH: ${{ github.workspace }}/target-repo/snyk_report.json

    steps:
      - name: Checkout AI Tools
        uses: actions/checkout@v4
        with:
          repository: PapaZouk/ai-devscops-lab
          ref: feature-remedaite-snyk-with-memory-tool
          path: ai-tools

      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repository }}
          path: target-repo
          token: ${{ secrets.GH_TOKEN }}

      - name: Ensure AI tools layout for local act runs
        run: |
          # In local `act --bind` runs, checkout path materialization can differ.
          # Keep expected ai-tools/* paths available without changing CI behavior.
          if [ ! -d "$TOOLS_DIR/ai-app-doctor" ] && [ -d "${{ github.workspace }}/ai-app-doctor" ]; then
            mkdir -p "$TOOLS_DIR"
            ln -s "${{ github.workspace }}/ai-app-doctor" "$TOOLS_DIR/ai-app-doctor"
          fi

          if [ ! -d "$TOOLS_DIR/mcp-security-server" ] && [ -d "${{ github.workspace }}/mcp-security-server" ]; then
            mkdir -p "$TOOLS_DIR"
            ln -s "${{ github.workspace }}/mcp-security-server" "$TOOLS_DIR/mcp-security-server"
          fi

          # In local/dev runs, prefer local workspace tool code over checked-out remote copy.
          if [ "${{ inputs.run_environment }}" = "dev" ] && [ -d "${{ github.workspace }}/ai-app-doctor" ]; then
            rm -rf "$TOOLS_DIR/ai-app-doctor"
            ln -s "${{ github.workspace }}/ai-app-doctor" "$TOOLS_DIR/ai-app-doctor"
          fi

          if [ "${{ inputs.run_environment }}" = "dev" ] && [ -d "${{ github.workspace }}/mcp-security-server" ]; then
            rm -rf "$TOOLS_DIR/mcp-security-server"
            ln -s "${{ github.workspace }}/mcp-security-server" "$TOOLS_DIR/mcp-security-server"
          fi

      - name: Resolve target directory
        run: |
          TARGET_DIR="$TARGET_REPO_DIR"
          if [ -n "${{ inputs.target_subdirectory }}" ]; then
            TARGET_DIR="$TARGET_REPO_DIR/${{ inputs.target_subdirectory }}"
          fi

          if [ ! -d "$TARGET_DIR" ]; then
            echo "::error::Target directory not found: $TARGET_DIR"
            exit 1
          fi

          echo "TARGET_DIR=$TARGET_DIR" >> "$GITHUB_ENV"
          echo "REPORT_PATH=$TARGET_DIR/snyk_report.json" >> "$GITHUB_ENV"
          echo "Using TARGET_DIR=$TARGET_DIR"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: 'ai-tools/ai-app-doctor/package-lock.json'

      - name: Install Snyk & Run Scan
        run: |
          SCAN_SCRIPT="$TOOLS_DIR/ai-app-doctor/scripts/run_snyk_scan.sh"
          if [ ! -f "$SCAN_SCRIPT" ] && [ -f "$TOOLS_DIR/scripts/run_snyk_scan.sh" ]; then
            SCAN_SCRIPT="$TOOLS_DIR/scripts/run_snyk_scan.sh"
          fi
          if [ ! -f "$SCAN_SCRIPT" ] && [ -f "${{ github.workspace }}/ai-app-doctor/scripts/run_snyk_scan.sh" ]; then
            SCAN_SCRIPT="${{ github.workspace }}/ai-app-doctor/scripts/run_snyk_scan.sh"
          fi
          if [ ! -f "$SCAN_SCRIPT" ] && [ -f "${{ github.workspace }}/scripts/run_snyk_scan.sh" ]; then
            SCAN_SCRIPT="${{ github.workspace }}/scripts/run_snyk_scan.sh"
          fi

          if [ ! -f "$SCAN_SCRIPT" ]; then
            echo "::error::Snyk scan script not found in ai-tools or workspace scripts directory."
            exit 1
          fi

          bash "$SCAN_SCRIPT" \
            "$TARGET_DIR" \
            "$REPORT_PATH" \
            "${{ inputs.target_repository }}"
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Build AI Tools
        run: |
          cd $TOOLS_DIR/mcp-security-server && npm install && npm run build
          cd $TOOLS_DIR/ai-app-doctor && npm install

      - name: Link Skills Into Target Repo
        run: |
          rm -rf $TARGET_DIR/skills
          ln -s $TOOLS_DIR/ai-app-doctor/skills $TARGET_DIR/skills
          find $TOOLS_DIR/ai-app-doctor/skills -name "*.sh" -exec chmod +x {} +

      - name: Run AI Agent Fixer
        run: |
          cd $TOOLS_DIR/ai-app-doctor

          npx tsx src/main.ts \
            --agent=security \
            --target=$TARGET_DIR \
            --input="Review the Snyk vulnerability report at snyk_report.json and apply necessary code fixes to the target repository."
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          LM_API_KEY: ${{ secrets.LM_API_KEY }}
          LM_BASE_URL: ${{ inputs.llm_url }}
          LM_MODEL_NAME: ${{ inputs.llm_model_name }}
          SKIP_DELIVERY: ${{ (inputs.run_environment == 'dev' || inputs.skip_delivery) && 'true' || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          # Ensures logs are kept during the session
          DEBUG: "orchestrator:*"
